[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linexrd"
version = "0.1.0"
description = "Sparse peak-set learning and verified scientific-record retrieval for PXRD"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "torch>=2.1", "scikit-learn>=1.3,<2"]

[project.scripts]
linexrd = "linexrd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
